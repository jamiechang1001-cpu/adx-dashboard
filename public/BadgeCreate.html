  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- Icon Components ---

    const IconCalendar = () => (

      const submenuItem = {

        display: 'flex',
        alignItems: 'center',
        padding: '0 16px 0 48px',

        fontSize: '13px',
        transition: 'all 0.2s',

      const submenuItemActive = {
        ...submenuItem,
        color: '#E84C85',
        background: '#FFF0F3',
        borderRight: '3px solid #E84C85',
      };

      const iconWrap = {
        marginRight: '10px',
        display: 'flex',
        alignItems: 'center',
        fontSize: '14px',

        display: 'flex',
        alignItems: 'center',

        padding: '16px 20px 8px',

      return (
        <div style={sidebarWrap}>

          <div style={menuGroup}>
            <div style={menuItem}>

          <div style={menuGroup}>

            <div style={submenuItem}>帖子/资讯(天级增量)数...</div>

          <div style={menuGroup}>
            <div style={menuItem}>
              <span style={iconWrap}>⚙</span>
              <span>运营工具</span>
              <span style={arrowWrap}><IconDown /></span>

          <div style={menuGroup}>

              <span>活动管理</span>

            <div style={menuItem}>

              <span>内容管理</span>
              <span style={arrowWrap}><IconDown /></span>
            </div>

            <div style={menuItem}>

              <span>任务中心后台</span>

            <div style={submenuItem}>流量券管理</div>
            <div style={submenuItemActive}>徽章管理</div>

            <div style={menuItem}>
              <span style={iconWrap}>☰</span>
              <span>达人认证管理</span>
              <span style={arrowWrap}><IconDown /></span>
            </div>
          </div>

          <div style={menuGroup}>
            <div style={menuItem}>
              <span style={iconWrap}>☰</span>
              <span>配置管理</span>
              <span style={arrowWrap}><IconDown /></span>
            </div>
          </div>
        </div>
      );
    };

    // --- Header Component ---
    const Header = () => {
      const headerWrap = {
        height: '48px',
        background: '#fff',
        borderBottom: '1px solid #E8E8E8',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        padding: '0 24px',
        position: 'sticky',
        top: 0,
        zIndex: 50,
      };

      const breadcrumbWrap = {
        display: 'flex',
        alignItems: 'center',
        gap: '4px',
        fontSize: '14px',
        color: '#595959',
      };

      const breadcrumbItem = {
        cursor: 'pointer',
      };

      const breadcrumbActive = {
        color: '#262626',
        fontWeight: 500,
      };

      const separator = {
        color: '#BFBFBF',
        margin: '0 4px',
      };

      const userWrap = {
        display: 'flex',
        alignItems: 'center',
        gap: '8px',
        cursor: 'pointer',
      };

      const avatar = {
        width: '28px',
        height: '28px',
        borderRadius: '50%',
        background: 'linear-gradient(135deg, #FFD666, #FAAD14)',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: '12px',
        color: '#fff',
      };

      return (
        <div style={headerWrap}>
          <div style={breadcrumbWrap}>
            <span style={breadcrumbItem}>徽章管理</span>

            <span style={breadcrumbItem}>徽章列表</span>
            <span style={separator}>/</span>
            <span style={{...breadcrumbItem, ...breadcrumbActive}}>新建徽章</span>

            <span style={{fontSize: '14px', color: '#595959'}}>张家敏</span>

          </div>
        </div>

    // --- Form Components ---
    const RequiredMark = () => <span style={{color: '#FF4D4F', marginRight: '4px'}}>*</span>;

    const Label = ({ children, help }) => (
      <label style={{
        display: 'inline-flex',
        alignItems: 'center',
        justifyContent: 'flex-end',
        width: '120px',
        textAlign: 'right',
        paddingRight: '12px',
        fontSize: '14px',
        color: '#595959',
        flexShrink: 0,
        whiteSpace: 'nowrap',
      }}>
        {children}
        {help && <span style={{marginLeft: '4px', display: 'inline-flex'}}><IconQuestion /></span>}
      </label>
    );

    const Input = ({ placeholder, style, ...props }) => (
      <input
        style={{
          height: '36px',
          padding: '0 12px',
          border: '1px solid #D9D9D9',
          borderRadius: '4px',
          fontSize: '14px',
          color: '#262626',
          outline: 'none',
          transition: 'border-color 0.2s',
          width: '100%',
          ...style,
        }}
        placeholder={placeholder}
        onFocus={(e) => e.target.style.borderColor = '#E84C85'}
        onBlur={(e) => e.target.style.borderColor = '#D9D9D9'}
        {...props}
      />
    );

    const Select = ({ placeholder, style, ...props }) => (
      <div style={{
        position: 'relative',
        width: '100%',
        ...style,
      }}>
        <select
          style={{
            height: '36px',
            padding: '0 32px 0 12px',
            border: '1px solid #D9D9D9',
            borderRadius: '4px',
            fontSize: '14px',
            color: '#BFBFBF',
            outline: 'none',
            width: '100%',
            appearance: 'none',
            background: '#fff',
            cursor: 'pointer',
          }}
          defaultValue=""
          {...props}
        >
          <option value="" disabled>{placeholder}</option>
        </select>
        <span style={{
          position: 'absolute',
          right: '12px',
          top: '50%',
          transform: 'translateY(-50%)',
          pointerEvents: 'none',
        }}><IconDown /></span>
      </div>
    );

    const FormItem = ({ label, help, children, style }) => (
      <div style={{
        display: 'flex',
        alignItems: 'center',
        marginBottom: '24px',
        ...style,
      }}>
        <Label help={help}>
          <RequiredMark />{label}
        </Label>
        <div style={{flex: 1, maxWidth: '560px'}}>{children}</div>
      </div>
    );

    const SectionTitle = ({ children }) => (
      <div style={{
        fontSize: '15px',
        fontWeight: 600,
        color: '#262626',
        marginBottom: '24px',
        paddingBottom: '12px',
        borderBottom: '1px solid #F0F0F0',
      }}>
        {children}
      </div>
    );

    const Radio = ({ checked, label, children }) => (
      <label style={{
        display: 'flex',
        alignItems: 'center',
        cursor: 'pointer',
        gap: '6px',
        fontSize: '14px',
        color: '#595959',
      }}>
        <span style={{
          width: '14px',
          height: '14px',
          borderRadius: '50%',
          border: checked ? '4px solid #E84C85' : '1px solid #D9D9D9',
          display: 'inline-block',
          transition: 'all 0.2s',
          flexShrink: 0,
        }} />
        <span>{label}</span>
        {children}

        marginLeft: '220px',
        minHeight: '100vh',
        background: '#F0F2F5',
        display: 'flex',
        flexDirection: 'column',
        width: 'calc(100% - 220px)',

        padding: '24px',
        flex: 1,
        width: '100%',
      };

      const cardWrap = {
        background: '#fff',
        borderRadius: '4px',
        padding: '24px',
        marginBottom: '24px',
        width: '100%',
      };

      const dateRangeWrap = {
        display: 'flex',
        alignItems: 'center',
        gap: '8px',
      };

      const dateInputWrap = {
        position: 'relative',
        flex: 1,

        width: '100%',
        height: '36px',
        padding: '0 32px 0 12px',
        border: '1px solid #D9D9D9',
        borderRadius: '4px',
        fontSize: '14px',
        color: '#BFBFBF',
        outline: 'none',
        background: '#fff',
      };

        position: 'absolute',
        right: '10px',
        top: '50%',
        transform: 'translateY(-50%)',
        pointerEvents: 'none',

        display: 'flex',
        flexDirection: 'column',
        gap: '12px',
      };

        display: 'flex',
        alignItems: 'center',
        gap: '8px',
      };

      const smallInput = {
        width: '120px',
        height: '32px',
        padding: '0 8px',
        border: '1px solid #D9D9D9',
        borderRadius: '4px',
        fontSize: '14px',
        outline: 'none',
      };

      const selectSmall = {
        width: '140px',
        position: 'relative',
      };

      const footerWrap = {
        position: 'fixed',
        bottom: 0,
        left: '220px',
        right: 0,
        height: '64px',
        background: '#fff',
        borderTop: '1px solid #E8E8E8',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'flex-end',
        padding: '0 24px',
        gap: '12px',
        zIndex: 50,
      };

      const btnPrimary = {
        height: '36px',
        padding: '0 24px',
        background: '#E84C85',
        color: '#fff',
        border: 'none',
        borderRadius: '4px',
        fontSize: '14px',
        cursor: 'pointer',
        transition: 'opacity 0.2s',
      };

      const btnDefault = {
        height: '36px',
        padding: '0 24px',
        background: '#fff',
        color: '#595959',
        border: '1px solid #D9D9D9',
        borderRadius: '4px',
        fontSize: '14px',
        cursor: 'pointer',
        transition: 'all 0.2s',
      };

        <div style={mainWrap}>

          <div style={contentWrap}>

              <FormItem label="名称">

              <FormItem label="类型">
                <Select placeholder="" />
              </FormItem>

              <FormItem label="分类" help>
                <Select placeholder="" />

              <FormItem label="可获得时间">
                <div style={dateRangeWrap}>
                  <div style={dateInputWrap}>
                    <input style={dateInput} placeholder="开始日期" readOnly />
                    <span style={dateIcon}><IconCalendar /></span>
                  </div>
                  <IconArrowRight />

                    <input style={dateInput} placeholder="结束日期" readOnly />

                  </div>
                </div>
              </FormItem>

              <FormItem label="发放等待周期" help>
                <div style={dateRangeWrap}>
                  <Input style={{flex: 1}} />
                  <div style={{width: '140px', position: 'relative'}}>
                    <select style={{
                      width: '100%',
                      height: '36px',
                      padding: '0 32px 0 12px',
                      border: '1px solid #D9D9D9',
                      borderRadius: '4px',
                      fontSize: '14px',
                      color: '#BFBFBF',
                      outline: 'none',
                      appearance: 'none',
                      background: '#fff',
                      cursor: 'pointer',
                    }} defaultValue="">
                      <option value="" disabled></option>
                    </select>
                    <span style={{position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none'}}><IconDown /></span>
                  </div>
                </div>
              </FormItem>

              <FormItem label="可佩带时间" help style={{alignItems: 'flex-start'}}>
                <div style={radioGroupWrap}>
                  <Radio checked={wearType === 'forever'} label="永久" />

                    <Radio checked={wearType === 'deadline'} label="截止时间" />
                    <div style={{width: '140px', position: 'relative'}}>
                      <select style={{
                        width: '100%',
                        height: '32px',
                        padding: '0 32px 0 12px',
                        border: '1px solid #D9D9D9',
                        borderRadius: '4px',
                        fontSize: '14px',
                        color: '#BFBFBF',
                        outline: 'none',
                        appearance: 'none',
                        background: '#fff',
                        cursor: 'pointer',
                      }} defaultValue="">

                      <span style={{position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none'}}><IconDown /></span>

                  </div>
                  <div style={radioRow}>
                    <Radio checked={wearType === 'days'} label="可用天数" />
                    <span style={{fontSize: '14px', color: '#595959'}}>获得后</span>
                    <input style={smallInput} />
                    <span style={{fontSize: '14px', color: '#595959'}}>天内有效</span>
                  </div>
                  <div style={radioRow}>
                    <Radio checked={wearType === 'natural'} label="自然周期" />
                    <div style={{width: '140px', position: 'relative'}}>
                      <select style={{
                        width: '100%',
                        height: '32px',
                        padding: '0 32px 0 12px',
                        border: '1px solid #D9D9D9',
                        borderRadius: '4px',
                        fontSize: '14px',
                        color: '#BFBFBF',
                        outline: 'none',
                        appearance: 'none',
                        background: '#fff',
                        cursor: 'pointer',
                      }} defaultValue="">
                        <option value="" disabled></option>
                      </select>
                      <span style={{position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none'}}><IconDown /></span>
                    </div>
                  </div>
                </div>
              </FormItem>
            </div>

            <div style={cardWrap}>
              <SectionTitle>展示排序</SectionTitle>
              <FormItem label="优先级" help>
                <Input placeholder="数值越大排序越靠前" />
              </FormItem>
            </div>

            <div style={{height: '64px'}} />
          </div>

          <div style={footerWrap}>
            <button style={btnPrimary}>保存</button>
            <button style={btnDefault}>取消</button>
          </div>
        </div>
      );
    };

    // --- App ---
    const App = () => (
      <div style={{display: 'flex'}}>
        <Sidebar />
        <BadgeForm />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
